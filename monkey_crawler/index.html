<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Monkey Crawler</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #1a1a2e;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    overflow: hidden;
    color: #fff;
    user-select: none;
  }
  #wrap {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    background: linear-gradient(#0b1d3a, #1d3a6e);
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    border-radius: 6px;
    image-rendering: pixelated;
    touch-action: none;
  }
  #hud {
    position: absolute;
    top: 16px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    padding: 0 24px;
    pointer-events: none;
    font-weight: 600;
    text-shadow: 0 2px 4px rgba(0,0,0,0.7);
  }
  #hud .pill {
    background: rgba(0,0,0,0.45);
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 16px;
  }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    background: rgba(10, 10, 25, 0.7);
    backdrop-filter: blur(4px);
    z-index: 10;
    transition: opacity 0.25s;
  }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  #overlay h1 {
    font-size: 56px;
    margin: 0 0 6px;
    background: linear-gradient(90deg, #E890B5, #3AA8A0);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    letter-spacing: 1px;
  }
  #overlay h2 {
    font-size: 18px;
    margin: 0 0 14px;
    font-weight: 500;
    color: #FCE0EC;
    opacity: 0.85;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  #overlay p { margin: 6px 0; opacity: 0.9; max-width: 420px; line-height: 1.55; }
  #backstory {
    font-style: italic;
    font-size: 15px;
    color: #FCE0EC;
    border-left: 2px solid #3AA8A0;
    padding: 6px 14px;
    margin: 14px 0;
    text-align: left;
    max-width: 380px;
  }
  #deathLine {
    margin: 6px 0 0;
    font-size: 18px;
    font-weight: 600;
  }
  #overlay button {
    margin-top: 18px;
    background: linear-gradient(180deg, #E890B5, #D46A98);
    border: none;
    color: #fff;
    padding: 14px 36px;
    font-size: 18px;
    font-weight: 700;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(212, 106, 152, 0.4);
    transition: transform 0.1s;
  }
  #overlay button:active { transform: scale(0.96); }
  .keys { font-size: 13px; opacity: 0.7; margin-top: 14px; }
  kbd {
    display: inline-block;
    background: #2c2c44;
    padding: 3px 8px;
    border-radius: 4px;
    border-bottom: 2px solid #14141f;
    font-family: ui-monospace, monospace;
    font-size: 12px;
    margin: 0 2px;
  }
</style>
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="420" height="700"></canvas>
  </div>
  <div id="hud">
    <div class="pill">Height: <span id="score">0</span> m</div>
    <div class="pill">Best: <span id="best">0</span> m</div>
  </div>
  <div id="overlay">
    <h1>Pip</h1>
    <h2>The Brass-Hearted</h2>
    <p id="deathLine" style="display:none"></p>
    <p id="backstory"></p>
    <button id="startBtn">Start Climbing</button>
    <div class="keys">
      Move: <kbd>&larr;</kbd><kbd>&rarr;</kbd> or <kbd>A</kbd><kbd>D</kbd> &nbsp;·&nbsp;
      Climb faster: <kbd>&uarr;</kbd>/<kbd>W</kbd> &nbsp;·&nbsp;
      Slow: <kbd>&darr;</kbd>/<kbd>S</kbd>
    </div>
  </div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width;
  const H = canvas.height;
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const startBtn = document.getElementById('startBtn');

  const STORAGE_KEY = 'monkey_crawler_best';
  let best = parseInt(localStorage.getItem(STORAGE_KEY) || '0', 10);
  bestEl.textContent = best;

  // ---- Pip color palette (locked per character art brief) ----
  const C = {
    pink:    '#E890B5',
    cream:   '#FCE0EC',
    magenta: '#D46A98',
    plum:    '#8F3A66',
    screen:  '#2A2A2A',
    mint:    '#3AA8A0',
    brass:   '#C8A06A'
  };

  // ---- Backstory generator ----
  const STORY = {
    makers: [
      'a kindly retired clockmaker',
      'a tinkerer named Wren who lived above a tea shop',
      'an old lighthouse keeper with arthritic hands',
      'a watchmaker who missed her son',
      'a wandering toy-mender with one good eye',
      'twin sisters who repaired music boxes',
      'a librarian who taught herself brass-smithing'
    ],
    homes: [
      'a tin biscuit box on the very top shelf',
      'the dusty attic of a forgotten observatory',
      'a sunlit windowsill above a bakery',
      'a curio cabinet between a porcelain cat and a snow globe',
      'a workbench cluttered with cogs and orange peels',
      'the breast pocket of a much-too-large coat',
      'a hatbox lined with newspaper from 1962'
    ],
    goals: [
      'a single brass cog that might mend his stuttering heart',
      'the last of the moonlit oranges that ripen only on rooftops',
      'his stolen wind-up key, snatched away by a thieving magpie',
      'a love letter that was mailed to the wrong floor',
      'the radio dish on the roof that whispers back to the stars',
      'a small friend who promised to wait at the very top',
      "the one window in the city that's still lit at this hour",
      'a kite tangled in the antennas, its tail still fluttering'
    ],
    quirks: [
      "He's never quite sure when his spring will run down.",
      "His tail counts the floors so he doesn't lose track.",
      'Every banana he eats spins his gears a little faster.',
      "He tilts his head exactly five degrees when he's curious.",
      "The pigeons think he's one of them. He doesn't correct them.",
      "His heart-window glows a little brighter when he's brave.",
      'He hums, very quietly, when no one is listening.',
      'He has counted to a million twice, just to be sure.'
    ]
  };
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  function genBackstory() {
    return `Built by ${pick(STORY.makers)}, Pip lives in ${pick(STORY.homes)}. ` +
           `Tonight, he's climbing for ${pick(STORY.goals)}. ` +
           `<br><br>${pick(STORY.quirks)}`;
  }

  // ---- Input ----
  const keys = {};
  window.addEventListener('keydown', e => {
    keys[e.key.toLowerCase()] = true;
    if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase())) e.preventDefault();
  });
  window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

  // Touch / pointer drag
  let pointerX = null;
  canvas.addEventListener('pointerdown', e => {
    pointerX = e.offsetX * (W / canvas.clientWidth);
  });
  canvas.addEventListener('pointermove', e => {
    if (pointerX !== null) pointerX = e.offsetX * (W / canvas.clientWidth);
  });
  canvas.addEventListener('pointerup', () => { pointerX = null; });
  canvas.addEventListener('pointercancel', () => { pointerX = null; });

  // ---- Game state ----
  let state = 'menu'; // 'menu', 'play', 'dead'
  let cameraY = 0;     // distance climbed (in world units)
  let speed = 1.6;     // base climb speed
  let monkey, obstacles, pickups, particles, sparkles;
  let spawnCursor = 0;
  let shake = 0;
  let timeAlive = 0;

  function reset() {
    cameraY = 0;
    speed = 1.6;
    timeAlive = 0;
    spawnCursor = 600;
    shake = 0;
    monkey = {
      x: W / 2,
      y: H - 140,        // screen-space y (we keep monkey at fixed screen y)
      vx: 0,
      r: 22,
      tilt: 0,
      legPhase: 0,
      blink: 0,
      alive: true
    };
    obstacles = [];
    pickups = [];
    particles = [];
    sparkles = [];
  }

  function showMenu(deathLine) {
    const titleEl = overlay.querySelector('h1');
    const subEl = overlay.querySelector('h2');
    const deathEl = document.getElementById('deathLine');
    const backstoryEl = document.getElementById('backstory');
    titleEl.textContent = 'Pip';
    subEl.textContent = 'The Brass-Hearted';
    if (deathLine) {
      deathEl.style.display = '';
      deathEl.innerHTML = deathLine;
    } else {
      deathEl.style.display = 'none';
      deathEl.innerHTML = '';
    }
    backstoryEl.innerHTML = genBackstory();
    overlay.classList.remove('hidden');
  }

  function start() {
    reset();
    state = 'play';
    overlay.classList.add('hidden');
  }

  function gameOver() {
    state = 'dead';
    const meters = Math.floor(cameraY / 10);
    let isBest = false;
    if (meters > best) {
      best = meters;
      localStorage.setItem(STORAGE_KEY, String(best));
      bestEl.textContent = best;
      isBest = true;
    }
    const line =
      `Pip fell from <b>${meters} m</b>. ` +
      (isBest && meters > 0 ? 'A new personal best.' : `(Best: ${best} m)`);
    startBtn.textContent = 'Wind Him Up Again';
    showMenu(line);
  }

  startBtn.addEventListener('click', start);

  // ---- Spawning ----
  // worldY here is the height (in pixels above starting point).
  // Obstacles are stored with worldY; their screen y = H - 140 - (worldY - cameraY)... actually we'll
  // use: screenY = obstacle.worldY_relative_to_camera mapped so that high worldY means above screen.
  // We model: when spawned, an obstacle has worldY = cameraY + H (off the top of screen, "above" monkey).
  // As cameraY grows, the obstacle's screenY increases (moves down screen toward monkey).
  // screenY_of(o) = monkey.y - (o.worldY - cameraY - 0)  ... let's just compute relative to camera below.

  function spawnObstacleRow(worldY) {
    // Some rows are empty — gives the player breathing room
    if (Math.random() < 0.3) return;

    // Pick a random obstacle type and lane(s)
    const r = Math.random();
    if (r < 0.28) {
      // Bird flying across — moving horizontally
      const fromLeft = Math.random() < 0.5;
      obstacles.push({
        type: 'bird',
        x: fromLeft ? -30 : W + 30,
        worldY,
        vx: (fromLeft ? 1 : -1) * (1.4 + Math.random() * 1.6),
        flap: 0,
        w: 36, h: 22
      });
    } else if (r < 0.5) {
      // Drone hovering - sways
      obstacles.push({
        type: 'drone',
        x: 60 + Math.random() * (W - 120),
        worldY,
        baseX: 0,
        sway: 30 + Math.random() * 50,
        phase: Math.random() * Math.PI * 2,
        w: 44, h: 28
      });
      obstacles[obstacles.length - 1].baseX = obstacles[obstacles.length - 1].x;
    } else if (r < 0.58) {
      // AC unit / window box - static, fixed lane (rare now)
      obstacles.push({
        type: 'ac',
        x: 40 + Math.random() * (W - 80),
        worldY,
        w: 56, h: 38
      });
    } else if (r < 0.78) {
      // Falling bolt
      obstacles.push({
        type: 'bolt',
        x: 30 + Math.random() * (W - 60),
        worldY,
        vy: 1.2 + Math.random() * 1.5, // bolt falls (worldY decreases over time)
        spin: 0,
        w: 14, h: 14
      });
    } else if (r < 0.93) {
      // Open window (rectangle obstacle, wide)
      const wide = 70 + Math.random() * 60;
      obstacles.push({
        type: 'window',
        x: 30 + Math.random() * (W - 60 - wide),
        worldY,
        w: wide, h: 50
      });
    } else {
      // Pigeon swarm: 3 small birds in a line
      const fromLeft = Math.random() < 0.5;
      const speedX = (fromLeft ? 1 : -1) * (1.0 + Math.random());
      for (let i = 0; i < 3; i++) {
        obstacles.push({
          type: 'bird',
          x: (fromLeft ? -30 : W + 30) - speedX * i * 40,
          worldY: worldY + (Math.random() - 0.5) * 30,
          vx: speedX,
          flap: Math.random() * Math.PI * 2,
          w: 28, h: 18,
          small: true
        });
      }
    }

    // Bananas — usually one, sometimes a small cluster
    const bananaCount = Math.random() < 0.35 ? 3 : (Math.random() < 0.85 ? 1 : 0);
    for (let i = 0; i < bananaCount; i++) {
      pickups.push({
        type: 'banana',
        x: 30 + Math.random() * (W - 60),
        worldY: worldY + (Math.random() - 0.5) * 80 + i * 24,
        bob: Math.random() * Math.PI * 2,
        r: 10,
        collected: false
      });
    }
  }

  // ---- Update ----
  function update(dt) {
    timeAlive += dt;
    // ramp difficulty
    speed = 1.6 + Math.min(3.0, timeAlive / 12);

    // Move camera up
    cameraY += speed * dt * 60;

    // Monkey horizontal control
    let target = monkey.x;
    let moveAxis = 0;
    if (keys['arrowleft'] || keys['a']) moveAxis -= 1;
    if (keys['arrowright'] || keys['d']) moveAxis += 1;
    if (pointerX !== null) {
      // Smoothly steer toward pointer
      target = pointerX;
      monkey.vx += (target - monkey.x) * 0.02;
    } else {
      monkey.vx += moveAxis * 0.55;
    }
    monkey.vx *= 0.85;
    monkey.x += monkey.vx;
    monkey.x = Math.max(28, Math.min(W - 28, monkey.x));
    monkey.tilt = monkey.tilt * 0.85 + (-monkey.vx * 0.04);
    monkey.legPhase += dt * 14;
    monkey.blink = Math.max(0, monkey.blink - dt);
    if (Math.random() < 0.003) monkey.blink = 0.18;

    // Climb speed boost / brake
    let climbMod = 1.0;
    if (keys['arrowup'] || keys['w']) climbMod = 1.6;
    if (keys['arrowdown'] || keys['s']) climbMod = 0.45;
    cameraY += (climbMod - 1) * speed * dt * 60;

    // Spawn obstacles ahead of camera
    while (spawnCursor < cameraY + H + 200) {
      spawnObstacleRow(spawnCursor);
      // Random vertical gap between rows (roomier; closes a bit over time)
      spawnCursor += 130 + Math.random() * 110 - Math.min(50, timeAlive * 1.0);
    }

    // Update obstacles
    for (const o of obstacles) {
      if (o.type === 'bird') {
        o.x += o.vx;
        o.flap += dt * 18;
      } else if (o.type === 'drone') {
        o.phase += dt * 2;
        o.x = o.baseX + Math.sin(o.phase) * o.sway;
      } else if (o.type === 'bolt') {
        o.worldY -= o.vy;
        o.spin += dt * 8;
      }
    }

    // Collision check & cleanup
    const monkeyScreenY = monkey.y;
    const monkeyWorldY = cameraY + (H - monkey.y); // higher world y = higher up
    // Actually, simpler: define screenY of an object as: H - 140 - (o.worldY - cameraY).
    // But our monkey sits at fixed monkey.y. Spawn worldY at cameraY + (H - monkey.y) means at monkey level.
    // Spawn at "above monkey" = cameraY + something larger. Let me just say screenY = monkey.y - (o.worldY - cameraY).
    // When worldY == cameraY, screenY = monkey.y (object reaches monkey's height).
    // When worldY > cameraY, screenY < monkey.y (above monkey on screen).
    // We spawn at cameraY + H so screenY = monkey.y - H ≈ -160 (off-top). Good.

    function screenYOf(o) { return monkey.y - (o.worldY - cameraY); }

    for (let i = obstacles.length - 1; i >= 0; i--) {
      const o = obstacles[i];
      const sy = screenYOf(o);
      o._sy = sy;
      // remove if past bottom
      if (sy > H + 80 || o.x < -120 || o.x > W + 120) {
        obstacles.splice(i, 1);
        continue;
      }
      if (!monkey.alive) continue;
      // collision: bounding circle vs box
      const dx = monkey.x - o.x;
      const dy = monkey.y - sy;
      const w2 = (o.w || 30) / 2 + monkey.r * 0.7;
      const h2 = (o.h || 30) / 2 + monkey.r * 0.7;
      if (Math.abs(dx) < w2 && Math.abs(dy) < h2) {
        hitMonkey();
        break;
      }
    }

    for (let i = pickups.length - 1; i >= 0; i--) {
      const p = pickups[i];
      const sy = screenYOf(p);
      p._sy = sy;
      p.bob += dt * 4;
      if (sy > H + 40) { pickups.splice(i, 1); continue; }
      if (p.collected) continue;
      const dx = monkey.x - p.x;
      const dy = monkey.y - sy;
      if (dx * dx + dy * dy < (p.r + monkey.r) ** 2) {
        p.collected = true;
        // bonus height
        cameraY += 50;
        for (let k = 0; k < 12; k++) {
          sparkles.push({
            x: p.x, y: sy,
            vx: (Math.random() - 0.5) * 4,
            vy: (Math.random() - 0.5) * 4 - 1,
            life: 0.6,
            color: '#ffd86b'
          });
        }
        pickups.splice(i, 1);
      }
    }

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy;
      p.vy += 0.15;
      p.life -= dt;
      if (p.life <= 0) particles.splice(i, 1);
    }
    for (let i = sparkles.length - 1; i >= 0; i--) {
      const s = sparkles[i];
      s.x += s.vx; s.y += s.vy;
      s.vy += 0.05;
      s.life -= dt;
      if (s.life <= 0) sparkles.splice(i, 1);
    }

    if (shake > 0) shake = Math.max(0, shake - dt * 4);

    scoreEl.textContent = Math.floor(cameraY / 10);
  }

  function hitMonkey() {
    if (!monkey.alive) return;
    monkey.alive = false;
    shake = 1.0;
    // Burst of bolts/sparks
    for (let i = 0; i < 24; i++) {
      particles.push({
        x: monkey.x, y: monkey.y,
        vx: (Math.random() - 0.5) * 8,
        vy: (Math.random() - 0.5) * 8 - 2,
        life: 1.2,
        color: ['#ffd86b', '#ff7eb6', '#7ed4ff', '#fff'][i % 4],
        size: 2 + Math.random() * 3
      });
    }
    setTimeout(gameOver, 700);
  }

  // ---- Rendering ----
  function drawWall() {
    // Wall base
    ctx.fillStyle = '#2d3553';
    ctx.fillRect(0, 0, W, H);

    // Vertical edges (building columns)
    ctx.fillStyle = '#262d44';
    ctx.fillRect(0, 0, 18, H);
    ctx.fillRect(W - 18, 0, 18, H);

    // Brick pattern + windows scrolling
    const bandH = 110;
    const offset = (cameraY * 1) % bandH; // wall scrolls down as we climb
    ctx.save();
    for (let row = -1; row < Math.ceil(H / bandH) + 1; row++) {
      const y = row * bandH + offset;
      // Concrete band
      ctx.fillStyle = '#343d5e';
      ctx.fillRect(18, y, W - 36, 6);
      ctx.fillStyle = '#262d44';
      ctx.fillRect(18, y + 6, W - 36, 2);

      // Windows: 3 across
      const winY = y + 30;
      const winH = 60;
      const cols = 3;
      const gap = (W - 36 - cols * 80) / (cols + 1);
      for (let c = 0; c < cols; c++) {
        const wx = 18 + gap + c * (80 + gap);
        // frame
        ctx.fillStyle = '#1a2038';
        ctx.fillRect(wx - 3, winY - 3, 86, winH + 6);
        // glass with subtle gradient by row+col
        const lit = ((row + c + Math.floor(cameraY / 200)) % 5 === 0);
        ctx.fillStyle = lit ? '#ffe9a8' : '#4a5a82';
        ctx.fillRect(wx, winY, 80, winH);
        // reflection slash
        ctx.fillStyle = lit ? 'rgba(255,255,255,0.35)' : 'rgba(255,255,255,0.07)';
        ctx.beginPath();
        ctx.moveTo(wx + 8, winY);
        ctx.lineTo(wx + 30, winY);
        ctx.lineTo(wx + 14, winY + winH);
        ctx.lineTo(wx, winY + winH);
        ctx.closePath();
        ctx.fill();
        // mullion
        ctx.fillStyle = '#1a2038';
        ctx.fillRect(wx + 38, winY, 4, winH);
        ctx.fillRect(wx, winY + 28, 80, 3);
      }
    }
    ctx.restore();

    // Pipe running up the side
    ctx.fillStyle = '#1a2038';
    ctx.fillRect(W - 30, 0, 6, H);
    ctx.fillStyle = '#3b4566';
    for (let y = -((cameraY * 1) % 40); y < H; y += 40) {
      ctx.fillRect(W - 32, y, 10, 4);
    }
  }

  function drawObstacle(o) {
    const sy = o._sy;
    ctx.save();
    ctx.translate(o.x, sy);
    if (o.type === 'bird') {
      const flap = Math.sin(o.flap) * 0.6;
      ctx.fillStyle = '#222';
      // body
      ctx.beginPath();
      ctx.ellipse(0, 0, o.small ? 8 : 10, o.small ? 5 : 6, 0, 0, Math.PI * 2);
      ctx.fill();
      // wings
      ctx.beginPath();
      ctx.moveTo(-2, -2);
      ctx.quadraticCurveTo(-12, -10 - flap * 6, -22, 0);
      ctx.quadraticCurveTo(-12, -2, -2, 2);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(2, -2);
      ctx.quadraticCurveTo(12, -10 - flap * 6, 22, 0);
      ctx.quadraticCurveTo(12, -2, 2, 2);
      ctx.fill();
      // beak
      ctx.fillStyle = '#ffae3a';
      ctx.beginPath();
      ctx.moveTo(o.vx > 0 ? 10 : -10, 0);
      ctx.lineTo(o.vx > 0 ? 16 : -16, 1);
      ctx.lineTo(o.vx > 0 ? 10 : -10, 2);
      ctx.fill();
      // eye
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(o.vx > 0 ? 5 : -5, -2, 1.5, 0, Math.PI * 2);
      ctx.fill();
    } else if (o.type === 'drone') {
      // body
      ctx.fillStyle = '#444a66';
      roundRect(-16, -8, 32, 16, 5, true);
      // led
      ctx.fillStyle = '#ff5e6c';
      ctx.beginPath();
      ctx.arc(0, 0, 2.5, 0, Math.PI * 2);
      ctx.fill();
      // arms / propellers
      ctx.fillStyle = '#2a2f44';
      ctx.fillRect(-22, -2, 8, 4);
      ctx.fillRect(14, -2, 8, 4);
      ctx.fillStyle = 'rgba(180,200,255,0.4)';
      ctx.beginPath(); ctx.arc(-22, 0, 9, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(22, 0, 9, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#7ed4ff';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(-30, 0); ctx.lineTo(-14, 0); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(14, 0); ctx.lineTo(30, 0); ctx.stroke();
    } else if (o.type === 'ac') {
      // metal box
      ctx.fillStyle = '#9aa3b8';
      roundRect(-o.w/2, -o.h/2, o.w, o.h, 3, true);
      ctx.fillStyle = '#6f788f';
      ctx.fillRect(-o.w/2 + 4, -o.h/2 + 4, o.w - 8, o.h - 16);
      // grill lines
      ctx.strokeStyle = '#3c4256';
      ctx.lineWidth = 1;
      for (let i = 0; i < 4; i++) {
        ctx.beginPath();
        ctx.moveTo(-o.w/2 + 6, -o.h/2 + 8 + i * 5);
        ctx.lineTo(o.w/2 - 6, -o.h/2 + 8 + i * 5);
        ctx.stroke();
      }
      // bottom shadow
      ctx.fillStyle = '#3c4256';
      ctx.fillRect(-o.w/2, o.h/2 - 5, o.w, 5);
      // brand sticker
      ctx.fillStyle = '#ffae3a';
      ctx.fillRect(-6, o.h/2 - 12, 12, 4);
    } else if (o.type === 'bolt') {
      ctx.rotate(o.spin);
      ctx.fillStyle = '#c9d1e0';
      ctx.beginPath();
      // hex
      for (let i = 0; i < 6; i++) {
        const a = i * Math.PI / 3;
        const x = Math.cos(a) * 8;
        const y = Math.sin(a) * 8;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#5b6280';
      ctx.beginPath();
      ctx.arc(0, 0, 3, 0, Math.PI * 2);
      ctx.fill();
    } else if (o.type === 'window') {
      // open window jutting out
      ctx.fillStyle = '#1a2038';
      ctx.fillRect(-o.w/2, -o.h/2, o.w, o.h);
      ctx.fillStyle = '#7fa8d8';
      ctx.fillRect(-o.w/2 + 3, -o.h/2 + 3, o.w - 6, o.h - 6);
      // glass shine
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.beginPath();
      ctx.moveTo(-o.w/2 + 6, -o.h/2 + 4);
      ctx.lineTo(-o.w/2 + 18, -o.h/2 + 4);
      ctx.lineTo(-o.w/2 + 8, o.h/2 - 4);
      ctx.lineTo(-o.w/2 + 4, o.h/2 - 4);
      ctx.closePath();
      ctx.fill();
      // hinge
      ctx.fillStyle = '#ffae3a';
      ctx.fillRect(-o.w/2 - 4, -o.h/2 + 6, 4, 6);
      ctx.fillRect(-o.w/2 - 4, o.h/2 - 12, 4, 6);
    }
    ctx.restore();
  }

  function drawPickup(p) {
    if (p.collected) return;
    const sy = p._sy;
    ctx.save();
    ctx.translate(p.x, sy + Math.sin(p.bob) * 3);
    ctx.rotate(-0.3 + Math.sin(p.bob * 0.7) * 0.1);
    // banana
    ctx.fillStyle = '#ffd86b';
    ctx.beginPath();
    ctx.moveTo(-10, 4);
    ctx.quadraticCurveTo(-2, -10, 12, -2);
    ctx.quadraticCurveTo(4, 6, -10, 4);
    ctx.fill();
    ctx.fillStyle = '#a37b1a';
    ctx.beginPath();
    ctx.arc(-10, 4, 2, 0, Math.PI * 2);
    ctx.arc(13, -2, 1.5, 0, Math.PI * 2);
    ctx.fill();
    // shine
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.beginPath();
    ctx.ellipse(0, -2, 4, 1.2, -0.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawMonkey() {
    const m = monkey;
    ctx.save();
    ctx.translate(m.x, m.y);
    ctx.rotate(m.tilt);

    const t = m.legPhase;
    const armSwing = Math.sin(t) * 5;
    const legSwing = Math.sin(t + Math.PI) * 3;
    const tailWag = Math.sin(t * 0.55);
    const heartPulse = m.alive ? (1 + Math.sin(timeAlive * 4) * 0.07) : 0.55;

    // === Tail: prehensile, curls forward in a loose hook ===
    const tailPath = () => {
      ctx.beginPath();
      ctx.moveTo(0, 16);
      ctx.bezierCurveTo(24, 22 + tailWag * 3, 36, 8 + tailWag * 4, 26, -2);
      ctx.bezierCurveTo(20, -8, 12, 0, 18, 6);
    };
    ctx.strokeStyle = C.plum;  ctx.lineWidth = 9; ctx.lineCap = 'round';
    tailPath(); ctx.stroke();
    ctx.strokeStyle = C.pink;  ctx.lineWidth = 6;
    tailPath(); ctx.stroke();
    // segment hint
    ctx.strokeStyle = C.magenta; ctx.lineWidth = 1;
    for (let s = 0.25; s < 0.95; s += 0.18) {
      const px = bezPt(0, 24, 36, 26, s).x;
      const py = bezPt(16, 22 + tailWag * 3, 8 + tailWag * 4, -2, s).y;
      ctx.beginPath();
      ctx.arc(px, py, 3.5, 0, Math.PI * 2);
      ctx.stroke();
    }

    // === Wind-up key on upper back (peeks above shoulder) ===
    ctx.save();
    ctx.translate(-3, -16);
    ctx.rotate(-0.35);
    ctx.fillStyle = C.brass;
    ctx.fillRect(-1.5, -10, 3, 8);          // shaft
    ctx.strokeStyle = C.brass; ctx.lineWidth = 2.5;
    ctx.strokeRect(-5, -16, 10, 7);          // squared loop top
    ctx.strokeStyle = C.plum; ctx.lineWidth = 0.7;
    ctx.strokeRect(-5, -16, 10, 7);
    ctx.restore();

    // === Back arm reaching up to next ledge ===
    drawPipArm(-10, -7, -16, -28 - armSwing, true);
    // === Back leg (stubby) ===
    drawPipLeg(-8, 12, -11, 22 + legSwing * 0.5);

    // === Torso (rose body, cream belly) ===
    ctx.fillStyle = C.plum;
    roundRect(-15, -10, 30, 26, 9, true);
    ctx.fillStyle = C.pink;
    roundRect(-14, -9, 28, 24, 8, true);
    ctx.fillStyle = C.cream;
    roundRect(-10, -3, 20, 16, 6, true);
    // seam down center
    ctx.strokeStyle = C.magenta; ctx.lineWidth = 0.8;
    ctx.beginPath(); ctx.moveTo(0, -3); ctx.lineTo(0, 13); ctx.stroke();
    // rivets
    ctx.fillStyle = C.magenta;
    for (const [rx, ry] of [[-12,-6],[12,-6],[-12,12],[12,12]]) {
      ctx.beginPath(); ctx.arc(rx, ry, 1.1, 0, Math.PI * 2); ctx.fill();
    }
    // shoulder ball joints
    ctx.fillStyle = C.magenta;
    ctx.beginPath(); ctx.arc(-13, -8, 2.5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(13, -8, 2.5, 0, Math.PI * 2); ctx.fill();

    // === Heart-shaped chest window with brass gears (the #1 icon) ===
    ctx.save();
    ctx.translate(0, 5);
    ctx.scale(heartPulse, heartPulse);
    // Heart path
    const heart = () => {
      ctx.beginPath();
      ctx.moveTo(0, 5);
      ctx.bezierCurveTo(-9, -1, -8, -8, -3, -6);
      ctx.bezierCurveTo(-1, -5, 0, -3, 0, -2);
      ctx.bezierCurveTo(0, -3, 1, -5, 3, -6);
      ctx.bezierCurveTo(8, -8, 9, -1, 0, 5);
      ctx.closePath();
    };
    // Magenta frame
    heart();
    ctx.fillStyle = C.magenta; ctx.fill();
    // Inset: clip & fill near-black
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(0, 4);
    ctx.bezierCurveTo(-7.5, -1, -6.5, -6.5, -2.5, -5);
    ctx.bezierCurveTo(-1, -4.2, 0, -2.5, 0, -1.5);
    ctx.bezierCurveTo(0, -2.5, 1, -4.2, 2.5, -5);
    ctx.bezierCurveTo(6.5, -6.5, 7.5, -1, 0, 4);
    ctx.closePath();
    ctx.clip();
    ctx.fillStyle = C.screen; ctx.fillRect(-10, -10, 20, 20);
    // Gears
    drawGear(-1.5, 0, 3, 8, t * 0.8);
    drawGear(2.6, -2.2, 1.8, 6, -t * 1.4);
    ctx.restore();
    // Glass shine
    ctx.fillStyle = 'rgba(252,224,236,0.5)';
    ctx.beginPath();
    ctx.ellipse(-2, -3, 1.6, 0.8, -0.5, 0, Math.PI * 2);
    ctx.fill();
    // Mint glow rim
    heart();
    ctx.lineWidth = 0.8;
    ctx.strokeStyle = C.mint;
    ctx.globalAlpha = 0.7;
    ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.restore();

    // === Front leg ===
    drawPipLeg(8, 12, 11, 22 - legSwing * 0.5);
    // === Front arm reaching up ===
    drawPipArm(10, -7, 16, -28 + armSwing, false);

    // === Head (oversized; the silhouette anchor) ===
    ctx.fillStyle = C.plum;
    roundRect(-17, -38, 34, 30, 10, true);
    ctx.fillStyle = C.pink;
    roundRect(-16, -37, 32, 28, 9, true);

    // Ears: oval panels with mint speaker disc
    ctx.fillStyle = C.plum;
    ctx.beginPath(); ctx.ellipse(-17, -23, 4, 6, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(17, -23, 4, 6, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = C.pink;
    ctx.beginPath(); ctx.ellipse(-17, -23, 3.2, 5, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(17, -23, 3.2, 5, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = C.mint;
    ctx.beginPath(); ctx.arc(-17, -23, 1.6, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(17, -23, 1.6, 0, Math.PI*2); ctx.fill();

    // Cream face plate (slight bevel around screen)
    ctx.fillStyle = C.cream;
    roundRect(-12, -34, 24, 20, 5, true);
    // Screen
    ctx.fillStyle = C.screen;
    roundRect(-10, -32, 20, 16, 3, true);
    // Subtle screen frame highlight
    ctx.strokeStyle = C.plum; ctx.lineWidth = 0.6;
    ctx.strokeRect(-10, -32, 20, 16);

    // Face content
    if (m.alive) {
      ctx.fillStyle = C.mint;
      if (m.blink > 0) {
        ctx.fillRect(-6, -24.5, 4, 1.2);
        ctx.fillRect(2, -24.5, 4, 1.2);
      } else {
        ctx.beginPath(); ctx.arc(-4, -24, 2.4, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(4, -24, 2.4, 0, Math.PI*2); ctx.fill();
        // off-center white highlights
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(-4.7, -24.7, 0.8, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(3.3, -24.7, 0.8, 0, Math.PI*2); ctx.fill();
      }
      // gentle smile
      ctx.strokeStyle = C.mint;
      ctx.lineWidth = 1.3;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-3.5, -19.5);
      ctx.quadraticCurveTo(0, -17.8, 3.5, -19.5);
      ctx.stroke();
    } else {
      // dim eyes, frown
      ctx.fillStyle = '#5b6280';
      ctx.beginPath(); ctx.arc(-4, -24, 2, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(4, -24, 2, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#5b6280';
      ctx.lineWidth = 1.3; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-3.5, -18.5);
      ctx.quadraticCurveTo(0, -20, 3.5, -18.5);
      ctx.stroke();
    }

    // === Antenna ===
    ctx.strokeStyle = C.plum;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, -38);
    ctx.lineTo(0, -45);
    ctx.stroke();
    if (m.alive) {
      ctx.fillStyle = 'rgba(58,168,160,0.25)';
      ctx.beginPath(); ctx.arc(0, -46, 5, 0, Math.PI*2); ctx.fill();
    }
    ctx.fillStyle = m.alive ? C.mint : '#5b6280';
    ctx.beginPath(); ctx.arc(0, -46, 2.5, 0, Math.PI*2); ctx.fill();

    ctx.restore();
  }

  // Bezier helper for tail segment dots
  function bezPt(p0, p1, p2, p3, t) {
    const it = 1 - t;
    return {
      x: it*it*it*p0 + 3*it*it*t*p1 + 3*it*t*t*p2 + t*t*t*p3,
      y: it*it*it*p0 + 3*it*it*t*p1 + 3*it*t*t*p2 + t*t*t*p3
    };
  }

  function drawPipArm(x1, y1, x2, y2, isBack) {
    const skin = isBack ? C.magenta : C.pink;
    const outline = C.plum;
    // Outline
    ctx.strokeStyle = outline; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    // Limb
    ctx.strokeStyle = skin; ctx.lineWidth = 3.2;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    // Elbow joint sphere
    const ex = (x1 + x2) / 2, ey = (y1 + y2) / 2;
    ctx.fillStyle = C.magenta;
    ctx.beginPath(); ctx.arc(ex, ey, 1.8, 0, Math.PI*2); ctx.fill();
    // Three-fingered hand
    const hr = 3.6;
    ctx.fillStyle = C.cream;
    ctx.beginPath(); ctx.arc(x2, y2, hr, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = outline; ctx.lineWidth = 0.9;
    ctx.beginPath(); ctx.arc(x2, y2, hr, 0, Math.PI*2); ctx.stroke();
    // Three finger nubs reaching toward wall (upward-ish)
    const dir = Math.atan2(y2 - y1, x2 - x1);
    ctx.strokeStyle = C.plum; ctx.lineWidth = 1.2; ctx.lineCap = 'round';
    for (const off of [-0.45, 0, 0.45]) {
      const a = dir + off;
      const fx1 = x2 + Math.cos(a) * (hr - 0.5);
      const fy1 = y2 + Math.sin(a) * (hr - 0.5);
      const fx2 = x2 + Math.cos(a) * (hr + 3);
      const fy2 = y2 + Math.sin(a) * (hr + 3);
      ctx.beginPath(); ctx.moveTo(fx1, fy1); ctx.lineTo(fx2, fy2); ctx.stroke();
    }
  }

  function drawPipLeg(x1, y1, x2, y2) {
    // Outline
    ctx.strokeStyle = C.plum; ctx.lineWidth = 7; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    // Limb
    ctx.strokeStyle = C.pink; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    // Hip joint
    ctx.fillStyle = C.magenta;
    ctx.beginPath(); ctx.arc(x1, y1, 2.3, 0, Math.PI*2); ctx.fill();
    // Paddle foot (rounded shoe)
    ctx.fillStyle = C.plum;
    ctx.beginPath(); ctx.ellipse(x2, y2 + 1, 6, 4, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = C.magenta;
    ctx.beginPath(); ctx.ellipse(x2, y2, 5, 3.2, 0, 0, Math.PI*2); ctx.fill();
  }

  function drawGear(cx, cy, r, teeth, rot) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rot);
    ctx.fillStyle = C.brass;
    ctx.beginPath();
    const N = teeth * 2;
    for (let i = 0; i < N; i++) {
      const a = (i / N) * Math.PI * 2;
      const rr = (i % 2 === 0) ? r : r * 0.72;
      const x = Math.cos(a) * rr;
      const y = Math.sin(a) * rr;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.fill();
    // hub
    ctx.fillStyle = '#8a6a3f';
    ctx.beginPath(); ctx.arc(0, 0, r * 0.32, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  function roundRect(x, y, w, h, r, fill) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
    if (fill) ctx.fill();
  }

  function render() {
    ctx.save();
    if (shake > 0) {
      const s = shake * 8;
      ctx.translate((Math.random() - 0.5) * s, (Math.random() - 0.5) * s);
    }
    drawWall();

    // Render pickups behind obstacles for depth
    for (const p of pickups) drawPickup(p);
    for (const o of obstacles) drawObstacle(o);

    if (state === 'play' || state === 'dead') drawMonkey();

    // particles
    for (const p of particles) {
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size || 2, 0, Math.PI * 2);
      ctx.fill();
    }
    // sparkles
    for (const s of sparkles) {
      ctx.fillStyle = s.color;
      ctx.globalAlpha = Math.max(0, s.life / 0.6);
      ctx.beginPath();
      ctx.arc(s.x, s.y, 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    // Speed lines for sense of climbing
    ctx.strokeStyle = 'rgba(255,255,255,0.06)';
    ctx.lineWidth = 1;
    for (let i = 0; i < 4; i++) {
      const x = ((i * 137 + cameraY * 0.3) % W);
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, 16);
      ctx.stroke();
    }

    ctx.restore();
  }

  // ---- Main loop ----
  let lastT = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - lastT) / 1000);
    lastT = now;
    if (state === 'play') update(dt);
    else if (state === 'dead') {
      // keep particles alive briefly
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
      }
      if (shake > 0) shake = Math.max(0, shake - dt * 4);
    }
    render();
    requestAnimationFrame(loop);
  }

  reset();
  // Show idle monkey on menu
  state = 'menu';
  monkey.alive = true;
  showMenu(null);
  requestAnimationFrame(loop);

  // Resize: scale canvas to fit viewport while preserving aspect
  function fit() {
    const margin = 24;
    const availW = window.innerWidth - margin * 2;
    const availH = window.innerHeight - margin * 2;
    const scale = Math.min(availW / W, availH / H);
    canvas.style.width = (W * scale) + 'px';
    canvas.style.height = (H * scale) + 'px';
  }
  fit();
  window.addEventListener('resize', fit);
})();
</script>
</body>
</html>
